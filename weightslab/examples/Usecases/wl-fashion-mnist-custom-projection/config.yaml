# Fashion-MNIST: train to convergence, pause from code, then project with your
# own algorithm (t-SNE) from the Studio notebook. The built-in projection is off.
experiment_name: fashion_mnist_custom_projection
device: auto
training_steps_to_do: null
# root_log_dir:              # defaults to $WEIGHTSLAB_ROOT_LOG_DIR, else a temp dir
auto_start_training: false   # true = start without pressing Play in the studio

optimizer:
  lr: 0.001

# When the script pauses itself.
convergence:
  eval_every_n_steps: 250    # evaluate the test split this often
  patience: 3                # ... and pause after this many evals ...
  min_delta: 0.25            # ... without +0.25 accuracy points
  pause_after_steps: 6000    # pause by this step at the latest (demo safety net)

experiment_dump_to_train_steps_ratio: 1000
skip_checkpoint_load: false
tqdm_display: true
is_training: false

ledger_enable_flushing_threads: true
ledger_enable_h5_persistence: true
ledger_flush_max_rows: 15000
ledger_flush_interval: 30.0

serving_grpc: true

data:
  train_loader:
    shuffle: true
    batch_size: 64
    max_samples: 20000
  test_loader:
    shuffle: false
    batch_size: 256
    max_samples: 2000        # t-SNE is O(N^2): a few thousand points is quick
    drop_last: false
