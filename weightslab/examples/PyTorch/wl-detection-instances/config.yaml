# Global configuration
device: auto
experiment_name: detection_pennfudan_instances
training_steps_to_do: null  # null = train until stopped from the Studio, the CLI or Ctrl+C
# root_log_dir:  # empty -> a temporary directory, or a path to keep logs and checkpoints

checkpoint_manager:
  load_config: false

compute_natural_sort: true

# Experiment parameters
eval_full_to_train_steps_ratio: 50
experiment_dump_to_train_steps_ratio: 50
tqdm_display: true
is_training: false  # training waits for Play in the Studio

# Serving
serving_grpc: true
serving_cli: true

ledger_enable_h5_persistence: true
ledger_enable_flushing_threads: true
ledger_flush_max_rows: 100
ledger_flush_interval: 60.0

# Model / task (same SmallDetector as examples/PyTorch/wl-detection)
num_classes: 1            # Penn-Fudan: person
image_size: 256
grid_size: 8
conf_thresh: 0.3
pretrained_backbone: true
freeze_backbone: true

optimizer:
  lr: 0.001

# Penn-Fudan pedestrians, shared with examples/PyTorch/wl-detection (downloaded
# there on first run); set a path to keep it elsewhere.
# data_root:
data:
  train_loader:
    batch_size: 8
    shuffle: true
    max_samples: null
  test_loader:
    batch_size: 8
    shuffle: false
    max_samples: null

# --- The point of this example -----------------------------------------------
# One projection point per BOX (wl.project_instances), train and test on one map,
# every `every_n_steps` training steps. The board's picker lists `prefix`.
instance_projection:
  every_n_steps: 150
  prefix: instances
  method: umap            # or pca
  epochs: 20              # UMAP fitting passes over the collected boxes
  conf: 0.3               # confidence a prediction needs to count
  match_iou: 0.5          # IoU above which a prediction sits on a label
