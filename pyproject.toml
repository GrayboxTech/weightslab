[build-system]
# setuptools>=64 for PEP 660 editable installs (`pip install -e .`, `uv sync`);
# setuptools_scm>=8.1 for version_scheme = "only-version". `wheel` and `build`
# are not backend requirements (setuptools asks for wheel itself when needed;
# build is a frontend), so they are not installed into every isolated build env.
requires = ["setuptools>=64", "setuptools_scm[toml]>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "weightslab"
dynamic = ["version"]
description = "Paving the way between black-box and white-box modeling."
readme = "README.md"
authors = [
  { name = "Alexandru-Andrei Rotaru", email = "alexandru@graybx.com" },
  { name = "Guillaue Pelluet", email = "guillaue@graybx.com" }
]
license = { text = "BSD 2-clause" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
]

# Runtime dependencies for the base package.
#
# Packaging note:
# - Avoid strict `==` pins in published libraries to reduce resolver conflicts for users.
# - Prefer compatible ranges, then pin exact versions only in CI/lockfiles.
dependencies = [
  # Core data / persistence
  # numpy 2 is supported: weightslab's source uses no numpy-1-only APIs, and its
  # compiled deps (torch, pandas, h5py, tables, onnx) ship numpy-2 wheels at the
  # versions pip resolves. Range left open (<3) so Colab's numpy 2.x installs
  # without a downgrade. Verified: import + torch/pandas interop + gRPC on np 2.4.
  "numpy>=1.24,<3",
  # Floor at 2.2.2 (not 2.2.3) so Colab's pinned pandas==2.2.2 is accepted
  # as-is: google-colab 1.0.0 requires pandas==2.2.2, and a >=2.2.3 floor forced
  # an upgrade to 2.3.x that breaks that pin. Clean installs still pick the
  # newest numpy-2-safe pandas (2.3.x).
  "pandas>=2.2.2,<3",
  "duckdb>=1.1,<2",  # signal/sample/instance history store
  "PyYAML>=6.0.3,<7",
  "dill>=0.3.8,<0.5",
  "zstandard>=0.22,<1",
  "h5py>=3.10,<4",
  "xxhash>=3.4,<4.1",
  "tables>=3.9,<4",  # h5 deps
  "pyarrow>=14,<23",  # default parquet engine for write_dataframe() checkpoints

  # PyTorch stack. Upper bounds left open (<3 / <1) so a pre-installed modern
  # torch (e.g. Colab's torch 2.9 / torchvision 0.24) is accepted as-is instead
  # of being downgraded — the reinstall churn is what dragged numpy across the
  # 1.x/2.x boundary and broke the ABI. Floors kept; pip picks a compatible
  # numpy-2 build on a clean install.
  "torch>=2.1,<=2.9",
  "torchvision>=0.16,<1",
  "torchmetrics>=1.9",

  # Serving / schema
  "grpcio>=1.80,<2",
  # Floor tracks the checked-in gencode: the *_pb2.py are regenerated with
  # grpcio-tools ~=1.68 (protoc gencode 5.28.1), so any runtime >=5.28.1 satisfies
  # protobuf's runtime>=gencode rule — including Colab's stock protobuf 5.29.6, so
  # NO upgrade is forced on Colab. IMPORTANT: regenerate the stubs with
  # grpcio-tools ~=1.68 to keep the gencode Colab-compatible; a newer grpcio-tools
  # bumps the gencode and reintroduces the VersionError on Colab. Upper bound <8
  # keeps modern runtimes (7.x) working.
  "protobuf>=6.31.1,<8",
  "pydantic>=2.7,<3",

  # Imaging
  "Pillow>=10,<12",
  "graphviz>=0.20,<1",

  # Modeling
  "onnx>=1.15,<=1.20",

  # Utility used in examples and progress reporting
  "tqdm>=4.66,<5",

  # Environment variable loading (used by agent service)
  "python-dotenv>=1,<2",

  # Agent service runtime deps (imported by default module graph). Only
  # langchain-core is needed -- it provides the Runnable/ChatPromptTemplate
  # abstraction OpenCodeChat.as_runnable() plugs into. No OpenCode-specific
  # SDK package exists; its client is hand-rolled in opencode_chat.py via
  # stdlib urllib/threading.
  "langchain-core>=0.3,<2",

  # Jupyter
  "ipykernel>=6.29,<7",
  "jupyter_client>=8.6,<9",
  "notebook>=7.6.1",
  "ipywidgets>=8.1.8",

  # Reporting
  "matplotlib>=3.7,<4",

  # Resource monitoring (CPU/memory/disk/network/process + NVIDIA GPU via NVML).
  # "nvidia-ml-py" is NVIDIA's officially maintained NVML binding, published
  # under the `pynvml` import name (the standalone `pynvml` PyPI package is the
  # unmaintained community fork -- do not swap this for it). Core dependency so
  # GPU metrics work out of the box on GPU machines; the monitor no-ops
  # gracefully when no NVIDIA driver is present (CPU-only machines). Versioned
  # after the CUDA driver generation it binds (already at 13.x), not semver --
  # keep the upper bound loose so a newer driver-generation release isn't
  # blocked.
  "psutil>=5.9,<8",
  "nvidia-ml-py>=11,<14",
]

[project.optional-dependencies]
# Optional: ultralytics onboarding
ultralytics = [
  "ultralytics>=8.4.16",
]

# Optional: runtime backend for ONNX model execution
onnx = [
  "onnxruntime>=1.17,<2",
  "onnxscript>=0.6.2,<0.7",
]

# Optional: developer tooling used for local development / codegen
dev = [
  "grpcio-tools>=1.62,<2",
  "torchinfo>=1.8,<2",
  "httpx>=0.27,<1",
]

# Optional: segmentation mask -> polygon extraction for annotation export
# (CVAT/Label Studio/V7). Bounding-box export needs none of this; only
# lazily imported inside weightslab.export when a segmentation mask is
# actually encountered.
export = [
  "opencv-python-headless>=4.8,<5",
]

utest = [
  "torchaudio>=2.1,<2.9; python_version < '3.13'",
  "torchaudio>=2.9,<3; python_version >= '3.13'",
  "torchmetrics>=1.3,<2",
  "pytorch-lightning>=2.2,<3",
  "tensorboard>=2.14,<3",
  "pytest>=9.0.2",
]

# Contributor tooling (PEP 735). `uv sync` installs the `dev` group by default;
# pip >= 25.1 reads it with `pip install --group dev`. Tests also need the
# `utest` extra: `uv sync --extra utest`.
[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-timeout>=2.3",
  "grpcio-tools>=1.62,<2",
  "torchinfo>=1.8,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
weightslab = "weightslab.cli:main"

[project.urls]
Homepage = "https://github.com/GrayboxTech/weightslab"

[tool.setuptools]
# Ship non-.py assets that live inside the package (cert scripts, bundled
# examples, pre-built UI). Combined with the explicit globs below so the CLI
# subcommands (`start`, `start example`, `se`) find their files in a
# pip-installed package.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["weightslab", "weightslab.*"]

[tool.setuptools.package-data]
# Bundle the cert-generation scripts, the example projects (main.py, config.yaml,
# sample data), and the pre-built Weights Studio SPA that `weightslab start`
# serves directly — no Docker required.
weightslab = [
  "ui/utils/**/*",
  "examples/**/*",
  # Pre-built Weights Studio SPA served by `weightslab start`.
  "ui/static/**/*",
  # Logo used to brand generated experiment reports (weightslab/reporting.py).
  "assets/**/*",
  # weightslab-integration grounding for the landing chat's preset prompts
  # and for agents dropped directly into a workspace (see opencode_process's
  # WORKSPACE_SEED_FILES) -- lives inside the package, not just at the
  # repo root, so a `pip install weightslab` ships it too.
  "AGENTS.md",
  # Seeded next to AGENTS.md in every experiment workspace. OpenCode reads a
  # project config from the directory it is started in, which is that same
  # workspace; this one points `instructions` at AGENTS.md.
  "opencode.json",
  # Last release tag, kept current by release.yml; the final fallback for
  # weightslab.__version__ (see _resolve_version in __init__.py).
  "VERSION",
]

[tool.setuptools.exclude-package-data]
# Never ship generated/local artifacts even if present on disk at build time.
weightslab = [
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.setuptools_scm]
# Write the generated version into a small module so your package can import it at runtime
write_to = "weightslab/_version.py"
# A build from a checkout takes the nearest tag as-is (v2.0.3.dev5 -> 2.0.3.dev5),
# the same value weightslab/VERSION and the runtime `git describe` fallback in
# __init__._resolve_version report. "guess-next-dev" refused to bump a .devN tag
# ("The 2.0.3.dev5 can't be bumped"), so every build from a commit after a dev
# tag failed: `pip install -e .`, `pip install git+...`, and the editable install
# `uv sync` / `uv run` perform on every call. Published builds never reach this:
# ci.yml and release.yml pin the version via SETUPTOOLS_SCM_PRETEND_VERSION_FOR_WEIGHTSLAB.
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.uv]
# The version is dynamic (setuptools_scm), so uv must rebuild the editable
# install when the commit or tags move, not only when pyproject.toml changes.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
markers = [
    "scale: large-history robustness tests (sweep-scale fixtures; deselect with -m 'not scale')",
]
filterwarnings = [
    # "tag:..." / dotted column names can never be Python identifiers.
    # h5_dataframe_store silences this at import, but pytest resets warning
    # filters after every test, so the suite needs its own copy.
    "ignore::tables.NaturalNameWarning",
    # Lightning's DataLoader performance hint; the tests use num_workers=0 on purpose.
    "ignore:.*does not have many workers:UserWarning",
    # ipykernel's own code (asyncio event-loop policies on Python 3.14+).
    "ignore::DeprecationWarning:ipykernel",
]
